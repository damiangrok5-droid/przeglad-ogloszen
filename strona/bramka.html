<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Przegląd ogłoszeń">
<meta name="application-name" content="Przegląd ogłoszeń">
<title>Przegląd ogłoszeń</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){try{var m=localStorage.getItem('motyw');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>
<style>
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-caption: 12px; --fs-footnote: 13px; --fs-sub: 15px; --fs-body: 17px; --fs-title3: 20px; --fs-title2: 22px; --fs-title1: 28px; --fs-large: 34px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s12: 48px;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-pill: 999px; --tap: 44px;
  --ease: cubic-bezier(.2,.8,.2,1); --t-fast: 120ms; --t-med: 220ms;
  --blur: saturate(180%) blur(20px);
}
:root, :root[data-theme="light"]{
  --bg: #f2f2f7; --bg-elev: #ffffff; --surface: rgba(255,255,255,.72); --surface-solid: #ffffff;
  --bar: rgba(242,242,247,.78); --bar-solid: #f2f2f7; --field: rgba(118,118,128,.12); --sep: rgba(60,60,67,.18);
  --text: #1c1c1e; --text-2: #636366; --accent: #007aff; --accent-text: #0062cc; --accent-fill: #0071e3; --on-accent: #fff;
  --ok: #34c759; --ok-text: #11702c; --warn: #ff9500; --warn-text: #9a5300; --bad: #ff3b30; --bad-text: #c4251c;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #000; --bg-elev: #1c1c1e; --surface: rgba(28,28,30,.72); --surface-solid: #1c1c1e;
    --bar: rgba(0,0,0,.72); --bar-solid: #0b0b0c; --field: rgba(118,118,128,.24); --sep: rgba(84,84,88,.6);
    --text: #f5f5f7; --text-2: #98989f; --accent: #0a84ff; --accent-text: #4da3ff; --accent-fill: #0071e3; --on-accent: #fff;
    --ok: #30d158; --ok-text: #30d158; --warn: #ff9f0a; --warn-text: #ffb340; --bad: #ff453a; --bad-text: #ff6961;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg: #000; --bg-elev: #1c1c1e; --surface: rgba(28,28,30,.72); --surface-solid: #1c1c1e;
  --bar: rgba(0,0,0,.72); --bar-solid: #0b0b0c; --field: rgba(118,118,128,.24); --sep: rgba(84,84,88,.6);
  --text: #f5f5f7; --text-2: #98989f; --accent: #0a84ff; --accent-text: #4da3ff; --accent-fill: #0071e3; --on-accent: #fff;
  --ok: #30d158; --ok-text: #30d158; --warn: #ff9f0a; --warn-text: #ffb340; --bad: #ff453a; --bad-text: #ff6961;
  --shadow: 0 8px 28px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font:400 var(--fs-body)/1.47 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
input,select{font-size:max(16px,1em)}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--surface-solid);border:1px solid var(--sep);box-shadow:var(--shadow)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:var(--surface);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .bar{background:var(--bar)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--surface-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .bar{background:var(--bar-solid)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:60vh;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 50% at 20% 30%,rgba(0,122,255,.16),transparent 70%),radial-gradient(35% 45% at 85% 20%,rgba(52,199,89,.12),transparent 70%)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s4)}
header.bar{position:sticky;top:0;z-index:10;background:var(--bar-solid);border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;gap:var(--s3);min-height:52px}
.bar h1{font-size:var(--fs-title3);font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--field);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:44px;min-width:44px;padding:0 10px;font-size:var(--fs-footnote);font-weight:600;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg-elev);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hero{padding:var(--s6) 0 var(--s3)}
.hero h2{font-size:var(--fs-large);line-height:1.12;margin:0 0 var(--s2);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--text-2);font-size:var(--fs-sub)}
.card{border-radius:var(--r-lg);padding:var(--s4);margin:var(--s3) 0}
.label{display:block;font-size:var(--fs-footnote);color:var(--text-2);font-weight:600;margin:0 0 var(--s1)}
.field{width:100%;min-height:var(--tap);border:0;border-radius:var(--r-sm);background:var(--field);padding:0 var(--s3);outline-offset:0}
select.field{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.row{display:flex;gap:var(--s2);align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
.btn{min-height:var(--tap);border-radius:var(--r-sm);border:0;padding:0 var(--s4);font-weight:600;cursor:pointer;background:var(--field);color:var(--accent-text)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.firmy{list-style:none;margin:var(--s2) 0 0;padding:0;max-height:264px;overflow:auto;border-radius:var(--r-sm)}
.firmy li button{width:100%;text-align:left;min-height:var(--tap);border:0;background:transparent;border-bottom:1px solid var(--sep);padding:0 var(--s2);cursor:pointer}
.firmy li button:hover{background:var(--field)}
.wybrana{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2);font-size:var(--fs-sub)}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:2px 10px;border-radius:var(--r-pill);background:var(--field);font-size:var(--fs-footnote);line-height:1.3;border:0}
button.chip{min-height:var(--tap);cursor:pointer;color:var(--accent-text);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:700;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.t-pewne{color:var(--ok-text)} .t-prawdopodobne{color:var(--warn-text)} .t-niepewne{color:var(--bad-text)}
.s-otwarte{color:var(--ok-text)} .s-inne{color:var(--text-2)}
.obszary{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s3);margin-top:var(--s3)}
.obszar{border-radius:var(--r-md);padding:var(--s3)}
.obszar h4{margin:0 0 var(--s1);font-size:var(--fs-sub)}
.obszar .meta{font-size:var(--fs-footnote);color:var(--text-2);margin-bottom:var(--s2)}
.obszar .progi{display:flex;flex-wrap:wrap;gap:6px}
details>summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;font-weight:700;font-size:var(--fs-title3);list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:rotate(45deg);transition:transform var(--t-fast) var(--ease)}
details[open]>summary::after{transform:rotate(-135deg)}
.filtry{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s3);margin-top:var(--s2)}
.check{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap);font-size:var(--fs-sub)}
.check input{width:22px;height:22px;accent-color:var(--accent-fill)}
.wynik{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s4) 0 var(--s2)}
.szybkie{display:grid;grid-template-columns:1fr;gap:var(--s2);flex:1 1 100%}
@media (min-width:560px){.szybkie{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:960px){.szybkie{flex:0 1 560px}}
.licz{flex:1 1 auto;min-width:0}.licz-opis{font-size:var(--fs-footnote);color:var(--text-2);margin-top:2px}
.zablokowane main>*:not(#bramka){display:none!important}
#bramka form{display:grid;gap:var(--s2);max-width:420px}.blad{color:var(--bad-text);min-height:1.2em}
.chip.n-sub{opacity:.72;border-style:dashed}
.wynik #licznik{font-weight:700;font-size:var(--fs-title3);display:block}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.prz{border-radius:var(--r-lg);padding:var(--s4)}
.prz .top{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline;flex-wrap:wrap;font-size:var(--fs-footnote);color:var(--text-2)}
.prz .termin{font-weight:700;color:var(--text);font-size:var(--fs-sub)}
.prz h3{font-size:var(--fs-body);margin:var(--s2) 0 2px;line-height:1.3;overflow-wrap:anywhere}
.prz .gdzie{font-size:var(--fs-footnote);color:var(--text-2)}
.prz .przedm{font-size:var(--fs-sub);margin:var(--s2) 0;overflow-wrap:anywhere}
.prz .subs{display:flex;flex-wrap:wrap;gap:6px;margin:var(--s2) 0}
.prz .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prz .akcje{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.prz .akcje>*{flex:1 1 140px;text-align:center;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.tabela{display:none}
@media (min-width:960px){
  .lista.karty{display:none}
  .tabela{display:block;border-radius:var(--r-lg)}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-footnote)}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--sep);vertical-align:top}
  th{position:sticky;top:53px;background:var(--bg-elev);z-index:1}
  thead th:first-child{border-top-left-radius:var(--r-lg)} thead th:last-child{border-top-right-radius:var(--r-lg)}
  th button{border:0;background:transparent;font-weight:700;cursor:pointer;min-height:32px;padding:0;color:var(--text);text-align:left}
  th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px} th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--field)}
  td .chip{margin:0 4px 4px 0}
  .hero h2{font-size:40px}
}
.wiecej{display:flex;justify-content:center;margin:var(--s4) 0}
.pusto{padding:var(--s6);text-align:center;color:var(--text-2)}
dialog{border:0;padding:0;border-radius:var(--r-lg);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 32px);color:var(--text);background:var(--bg-elev);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-head{position:sticky;top:0;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--sep);background:var(--bg-elev)}
.dlg-head h3{margin:0;flex:1;font-size:var(--fs-body);overflow-wrap:anywhere}
.dlg-body{padding:var(--s4)}
.dlg-body h4{margin:var(--s5) 0 var(--s2);font-size:var(--fs-sub)}
.kv{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:6px var(--s3);font-size:var(--fs-sub);margin:0}
.kv dt{color:var(--text-2)} .kv dd{margin:0;overflow-wrap:anywhere}
.mini{list-style:none;margin:0;padding:0;font-size:var(--fs-sub)}
.mini li{padding:var(--s2) 0;border-bottom:1px solid var(--sep);overflow-wrap:anywhere}
.uwaga{font-size:var(--fs-footnote);color:var(--text-2)}
footer{margin:var(--s8) 0 var(--s12);font-size:var(--fs-footnote);color:var(--text-2)}
footer a{word-break:break-word}
footer ul.zr{list-style:none;margin:var(--s2) 0;padding:0}footer ul.zr a{display:inline-flex;align-items:center;min-height:44px}
.ladowanie{padding:var(--s8);text-align:center;color:var(--text-2)}
</style>

<style>
.wrap{max-width:440px;margin:0 auto;padding:calc(var(--s12) + env(safe-area-inset-top)) var(--s4) var(--s8)}
.wrap h1{font-size:var(--fs-title1);line-height:1.15;margin:0 0 var(--s6);letter-spacing:-.01em}
.wrap form{display:grid;gap:var(--s3)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Przegląd ogłoszeń</h1>
  <section class="card glass" aria-labelledby="t">
    <h2 id="t">Dostęp chroniony hasłem</h2>
    <form id="f">
      <label class="label" for="haslo">Hasło</label>
      <input id="haslo" class="field" type="password" autocomplete="current-password" required>
      <button id="ok" type="submit" class="btn">Otwórz</button>
      <p id="stan" class="uwaga" aria-live="polite"></p>
      <p id="blad" class="blad" role="alert"></p>
    </form>
  </section>
</main>
<script>
/* Zakres funkcji: aplikacja wczytywana przez document.write deklaruje te same nazwy globalnie. */
(()=>{
/* Bramka publiczna: AES-256-GCM, klucz z PBKDF2-SHA256 (parametry w dane/klucz.json). Po poprawnym haśle odszyfrowuje dane/aplikacja.enc. */
const $=s=>document.querySelector(s);
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function getJ(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function odszyfruj(o,k){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.ct)));}
async function zHasla(h,m){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(h),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(m.salt),iterations:m.iter},b,{name:'AES-GCM',length:256},true,['decrypt']);}
async function dobry(k,m){try{return (await odszyfruj(m.test,k))==='ok';}catch(e){return false;}}
async function otworz(k){const a=await getJ('dane/aplikacja.enc');const h=await odszyfruj(a,k);document.open();document.write(h);document.close();}
(async function(){
  let m;try{m=await getJ('dane/klucz.json');}catch(e){$('#blad').textContent='Nie udało się wczytać strony ('+e.message+').';return;}
  const z=sessionStorage.getItem('k');
  if(z){try{const k=await crypto.subtle.importKey('raw',b64d(z),'AES-GCM',true,['decrypt']);if(await dobry(k,m)){await otworz(k);return;}}catch(e){}sessionStorage.removeItem('k');}
  $('#haslo').focus();
  $('#f').addEventListener('submit',async ev=>{ev.preventDefault();$('#ok').disabled=true;$('#blad').textContent='';$('#stan').textContent='Sprawdzanie…';
    try{const k=await zHasla($('#haslo').value,m);
      if(await dobry(k,m)){sessionStorage.setItem('k',b64e(await crypto.subtle.exportKey('raw',k)));$('#haslo').value='';$('#stan').textContent='Otwieranie…';await otworz(k);return;}
      $('#stan').textContent='';$('#blad').textContent='Nieprawidłowe hasło.';}catch(e){$('#stan').textContent='';$('#blad').textContent='Błąd: '+e.message;}
    $('#ok').disabled=false;$('#haslo').select();});
})();
})();
</script>
</body>
</html>
