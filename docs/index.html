<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Przegląd ogłoszeń">
<meta name="application-name" content="Przegląd ogłoszeń">
<title>Przegląd ogłoszeń</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){try{var m=localStorage.getItem('motyw');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>
<style>
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --r1:6px; --r2:8px; --r3:12px; --r4:16px; --tap:44px; --bar-h:56px;
  --ease:cubic-bezier(.2,.8,.2,1); --t1:120ms; --t2:200ms; --t3:280ms;
  --blur: saturate(180%) blur(16px);
}
:root, :root[data-theme="light"]{
  --bg:#ffffff; --bg-2:#f7f7f8; --bg-3:#efeff1; --line:#e6e6e9; --line-2:#d2d2d7;
  --text:#111113; --text-2:#5b5b65; --text-3:#6b6b75;
  --accent:#0066d6; --accent-text:#005fc7; --accent-fill:#0066d6; --accent-soft:rgba(0,102,214,.10); --on-accent:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --muted:#a1a1aa; --bad-text:#b42318;
  --bar:rgba(255,255,255,.78); --bar-solid:#ffffff; --hover:rgba(17,17,19,.04); --press:rgba(17,17,19,.07); --overlay:rgba(17,17,19,.36);
  --pop:0 1px 2px rgba(17,17,19,.06), 0 12px 32px rgba(17,17,19,.14);
  --skel:#ececef;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --bg-2:#131315; --bg-3:#1b1b1e; --line:#242428; --line-2:#34343a;
    --text:#ededef; --text-2:#a1a1aa; --text-3:#8e8e98;
    --accent:#4c95ff; --accent-text:#74adff; --accent-fill:#0066d6; --accent-soft:rgba(76,149,255,.14); --on-accent:#ffffff;
    --ok:#3fb950; --warn:#e3a008; --bad:#f85149; --muted:#63636b; --bad-text:#ff7b72;
    --bar:rgba(11,11,12,.74); --bar-solid:#0b0b0c; --hover:rgba(255,255,255,.04); --press:rgba(255,255,255,.08); --overlay:rgba(0,0,0,.62);
    --pop:0 0 0 1px #2a2a2f, 0 16px 40px rgba(0,0,0,.6);
    --skel:#1d1d20;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg-2:#131315; --bg-3:#1b1b1e; --line:#242428; --line-2:#34343a;
  --text:#ededef; --text-2:#a1a1aa; --text-3:#8e8e98;
  --accent:#4c95ff; --accent-text:#74adff; --accent-fill:#0066d6; --accent-soft:rgba(76,149,255,.14); --on-accent:#ffffff;
  --ok:#3fb950; --warn:#e3a008; --bad:#f85149; --muted:#63636b; --bad-text:#ff7b72;
  --bar:rgba(11,11,12,.74); --bar-solid:#0b0b0c; --hover:rgba(255,255,255,.04); --press:rgba(255,255,255,.08); --overlay:rgba(0,0,0,.62);
  --pop:0 0 0 1px #2a2a2f, 0 16px 40px rgba(0,0,0,.6);
  --skel:#1d1d20;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font:400 15px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
input,select{font-size:16px}
a,button,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-text);text-decoration:none;text-underline-offset:2px}
@media (hover:hover){a:hover{text-decoration:underline}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
.label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin:0 0 6px}
.field{width:100%;min-height:var(--tap);border:1px solid var(--line-2);border-radius:var(--r2);background:var(--bg);padding:0 12px;
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease)}
.field::placeholder{color:var(--text-3)}
.field:focus,.field:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.field{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);border-radius:var(--r2);border:1px solid var(--line-2);
  padding:0 var(--s4);font-size:15px;font-weight:500;cursor:pointer;background:var(--bg);color:var(--text);text-decoration:none;white-space:nowrap;
  transition:background-color var(--t1) var(--ease),border-color var(--t1) var(--ease),transform var(--t1) var(--ease)}
.btn.primary{background:var(--accent-fill);border-color:transparent;color:var(--on-accent)}
.btn:active:not(:disabled){transform:scale(.98);background-color:var(--press)}
.btn.primary:active:not(:disabled){background-color:var(--accent-fill);filter:brightness(.92)}
@media (hover:hover){.btn:hover:not(:disabled){background-color:var(--hover);border-color:var(--text-3);text-decoration:none}.btn.primary:hover:not(:disabled){background-color:var(--accent-fill);filter:brightness(1.08)}}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-busy="true"]{cursor:progress}
.uwaga{font-size:13px;color:var(--text-2)}
.blad{color:var(--bad-text);min-height:1.2em;font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:360px;margin:0 auto;
  padding:calc(var(--s12) + env(safe-area-inset-top)) var(--s5) var(--s16)}
.znak{width:28px;height:28px;border-radius:8px;background:var(--text);position:relative;margin:0 0 var(--s6)}
.znak::after{content:"";position:absolute;left:7px;right:7px;top:13px;height:2px;border-radius:1px;background:var(--bg)}
.wrap h1{font:650 26px/1.15 var(--font-d);letter-spacing:-.022em;margin:0}
.wrap .pod{margin:var(--s2) 0 var(--s8);color:var(--text-2);font-size:15px}
.wrap form{display:grid;gap:var(--s3)}
.wrap form .btn{width:100%;margin-top:var(--s1)}
#stan{margin:0;min-height:1.2em}
.wrap{animation:pojaw var(--t3) var(--ease) both}
@keyframes pojaw{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:479.98px){.wrap{justify-content:flex-start;padding-top:calc(18vh + env(safe-area-inset-top))}}
</style>
</head>
<body>
<main class="wrap" aria-labelledby="t">
  <div class="znak" aria-hidden="true"></div>
  <h1 id="t">Przegląd ogłoszeń</h1>
  <p class="pod">Strona chroniona hasłem.</p>
  <form id="f">
    <div><label class="label" for="haslo">Hasło</label>
    <input id="haslo" class="field" type="password" autocomplete="current-password" required></div>
    <button id="ok" type="submit" class="btn primary">Otwórz</button>
    <p id="stan" class="uwaga" aria-live="polite"></p>
    <p id="blad" class="blad" role="alert"></p>
  </form>
</main>
<script>
/* Zakres funkcji: aplikacja wczytywana przez document.write deklaruje te same nazwy globalnie. */
(()=>{
/* Bramka publiczna: AES-256-GCM, klucz z PBKDF2-SHA256 (parametry w dane/klucz.json). Po poprawnym haśle odszyfrowuje dane/aplikacja.enc. */
const $=s=>document.querySelector(s);
const b64d=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function getJ(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function odszyfruj(o,k){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.ct)));}
async function zHasla(h,m){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(h),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(m.salt),iterations:m.iter},b,{name:'AES-GCM',length:256},true,['decrypt']);}
async function dobry(k,m){try{return (await odszyfruj(m.test,k))==='ok';}catch(e){return false;}}
async function otworz(k){const a=await getJ('dane/aplikacja.enc');const h=await odszyfruj(a,k);document.open();document.write(h);document.close();}
(async function(){
  let m;try{m=await getJ('dane/klucz.json');}catch(e){$('#blad').textContent='Nie udało się wczytać strony ('+e.message+').';return;}
  const z=sessionStorage.getItem('k');
  if(z){try{const k=await crypto.subtle.importKey('raw',b64d(z),'AES-GCM',true,['decrypt']);if(await dobry(k,m)){await otworz(k);return;}}catch(e){}sessionStorage.removeItem('k');}
  $('#haslo').focus();
  $('#f').addEventListener('submit',async ev=>{ev.preventDefault();$('#ok').disabled=true;$('#blad').textContent='';$('#stan').textContent='Sprawdzanie…';
    try{const k=await zHasla($('#haslo').value,m);
      if(await dobry(k,m)){sessionStorage.setItem('k',b64e(await crypto.subtle.exportKey('raw',k)));$('#haslo').value='';$('#stan').textContent='Otwieranie…';await otworz(k);return;}
      $('#stan').textContent='';$('#blad').textContent='Nieprawidłowe hasło.';}catch(e){$('#stan').textContent='';$('#blad').textContent='Błąd: '+e.message;}
    $('#ok').disabled=false;$('#haslo').select();});
})();
})();
</script>
</body>
</html>
