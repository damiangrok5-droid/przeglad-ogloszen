name: aktualizacja-i-publikacja
# Uruchamianie ręczne (workflow_dispatch) oraz harmonogram pn i czw.
# Cron jest w UTC: zimą (UTC+1) 06:00 = 05:00 UTC; od ostatniej niedzieli marca (UTC+2) zmień na '0 4 * * 1,4'.
on:
  workflow_dispatch:
    inputs:
      ostatnia:
        description: 'Wymuś datę ostatniej aktualizacji (RRRR-MM-DD), puste = z zapisanego stanu'
        required: false
  schedule:
    - cron: '0 5 * * 1,4'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publikacja
  cancel-in-progress: false
jobs:
  buduj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sekrety obecne
        run: |
          [ ${#SITE_PASSWORD} -ge 12 ] || { echo "::error::brak SITE_PASSWORD (min. 12 znaków)"; exit 1; }
      - name: Otwórz zaszyfrowany pakiet plików roboczych
        run: |
          python3 narzedzia/pakiet.py otworz
          python3 narzedzia/pakiet.py sprawdz
      - name: Pobierz poprzedni stan (zaszyfrowany) z opublikowanej strony lub stan początkowy
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dane/stan.enc"
          if curl -fsSL --retry 3 -o stan/poprzedni.enc "$URL"; then echo "stan z publikacji"; else cp stan/stan_poczatkowy.enc stan/poprzedni.enc; echo "stan początkowy"; fi
          node narzedzia/stan.mjs odszyfruj stan/poprzedni.enc stan/stan.json.gz
          # stan początkowy z repo wygrywa, jeśli jest nowszy (np. po uzupełnieniu wstecznym wykonanym lokalnie)
          node narzedzia/stan.mjs odszyfruj stan/stan_poczatkowy.enc stan/poczatkowy.json.gz
          python3 - <<'PY'
          import gzip, json, os
          def t(p):
              s = json.load(gzip.open(p, 'rt', encoding='utf-8'))
              return max((s.get('ostatnia_aktualizacja') or {}).values() or [''])
          a, b = t('stan/stan.json.gz'), t('stan/poczatkowy.json.gz')
          if b > a:
              os.replace('stan/poczatkowy.json.gz', 'stan/stan.json.gz'); print('stan początkowy nowszy:', b, '>', a)
          else:
              os.remove('stan/poczatkowy.json.gz'); print('stan z publikacji:', a)
          PY
      - name: Zależności odczytu plików z archiwum
        run: |
          pip install --quiet cryptography==46.0.3 openpyxl==3.1.5 python-docx==1.2.0 xlrd==2.0.2 reportlab==4.4.4
          sudo apt-get install -y -qq poppler-utils antiword >/dev/null
      - name: Pobierz prywatne archiwum plików (klucz tylko do odczytu)
        env:
          ARCHIWUM_KLUCZ: ${{ secrets.ARCHIWUM_KLUCZ }}
        run: |
          if [ -z "$ARCHIWUM_KLUCZ" ]; then echo "::notice::brak sekretu ARCHIWUM_KLUCZ – archiwum pominięte"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ARCHIWUM_KLUCZ" > ~/.ssh/archiwum && chmod 600 ~/.ssh/archiwum
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/archiwum -o IdentitiesOnly=yes" git clone --quiet --depth 1 git@github.com:${{ github.repository_owner }}/archiwum-plikow.git tmp/archiwum \
            || echo "::warning::nie udało się pobrać archiwum plików"
          rm -f ~/.ssh/archiwum
      - name: Aktualizacja przyrostowa TED i BZP
        env:
          OSTATNIA: ${{ inputs.ostatnia }}
        run: |
          ARG=""; if [ -n "$OSTATNIA" ]; then [[ "$OSTATNIA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::zły format daty"; exit 1; }; ARG="--ostatnia $OSTATNIA"; fi
          set +e
          [ -d tmp/archiwum/.git ] && ARG="$ARG --zalaczniki tmp/archiwum"
          python3 narzedzia/aktualizuj.py --stan stan/stan.json.gz --strona strona/dane --logi logi $ARG
          rc=$?; set -e
          if [ $rc -eq 3 ]; then echo "::warning::część źródeł nie została pobrana – szczegóły w logu powyżej; okres zostanie pobrany ponownie"; elif [ $rc -ne 0 ]; then exit $rc; fi
      - name: Budowa zaszyfrowanej strony
        run: |
          node narzedzia/szyfruj.mjs strona _site
          node narzedzia/stan.mjs szyfruj stan/stan.json.gz _site/dane/stan.enc
      - name: Testy (blokują publikację)
        run: python3 testy/testy.py --stan stan/stan.json.gz --dane strona/dane --build _site --strona strona --repo . --wynik testy_wynik.json
      - name: Test odczytu plików z archiwum (blokuje publikację)
        run: python3 testy/test_zalaczniki.py --stan stan/stan.json.gz
      - name: Test przeglądarkowy (blokuje publikację)
        run: |
          pip install --quiet playwright==1.64.1
          python3 -m playwright install --with-deps chromium
          python3 testy/test_przegladarka.py _site --wynik testy_przegladarka.json
      - name: Usuń jawne dane robocze
        if: always()
        run: rm -rf tmp/archiwum && rm -f stan/stan.json.gz stan/poczatkowy.json.gz stan/poprzedni.enc strona/dane/*.json && rm -f narzedzia/aktualizuj.py narzedzia/zalaczniki.py narzedzia/dowody.py narzedzia/eksport.py narzedzia/reguly.py narzedzia/slownik.py narzedzia/wspolne.py strona/aplikacja.html testy/testy_danych.py testy/zakazane.json testy/test_zalaczniki.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  publikuj:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
