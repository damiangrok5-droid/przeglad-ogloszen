name: aktualizacja-i-publikacja
# Uruchamianie ręczne (workflow_dispatch) oraz harmonogram pn i czw.
# Cron jest w UTC: zimą (UTC+1) 06:00 = 05:00 UTC; od ostatniej niedzieli marca (UTC+2) zmień na '0 4 * * 1,4'.
on:
  workflow_dispatch:
    inputs:
      ostatnia:
        description: 'Wymuś datę ostatniej aktualizacji (RRRR-MM-DD), puste = z zapisanego stanu'
        required: false
  schedule:
    - cron: '0 5 * * 1,4'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publikacja
  cancel-in-progress: false
jobs:
  buduj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sekrety obecne
        run: |
          [ ${#SITE_PASSWORD} -ge 12 ] || { echo "::error::brak SITE_PASSWORD (min. 12 znaków)"; exit 1; }
      - name: Otwórz zaszyfrowany pakiet plików roboczych
        run: |
          python3 narzedzia/pakiet.py otworz
          python3 narzedzia/pakiet.py sprawdz
      - name: Pobierz poprzedni stan (zaszyfrowany) z opublikowanej strony lub stan początkowy
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dane/stan.enc"
          if curl -fsSL --retry 3 -o stan/poprzedni.enc "$URL"; then echo "stan z publikacji"; else cp stan/stan_poczatkowy.enc stan/poprzedni.enc; echo "stan początkowy"; fi
          node narzedzia/stan.mjs odszyfruj stan/poprzedni.enc stan/stan.json.gz
      - name: Aktualizacja przyrostowa TED i BZP
        env:
          OSTATNIA: ${{ inputs.ostatnia }}
        run: |
          ARG=""; if [ -n "$OSTATNIA" ]; then [[ "$OSTATNIA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::zły format daty"; exit 1; }; ARG="--ostatnia $OSTATNIA"; fi
          set +e
          python3 narzedzia/aktualizuj.py --stan stan/stan.json.gz --strona strona/dane --logi logi $ARG
          rc=$?; set -e
          if [ $rc -eq 3 ]; then echo "::warning::część źródeł nie została pobrana – szczegóły w logu powyżej; okres zostanie pobrany ponownie"; elif [ $rc -ne 0 ]; then exit $rc; fi
      - name: Budowa zaszyfrowanej strony
        run: |
          node narzedzia/szyfruj.mjs strona _site
          node narzedzia/stan.mjs szyfruj stan/stan.json.gz _site/dane/stan.enc
      - name: Testy (blokują publikację)
        run: python3 testy/testy.py --stan stan/stan.json.gz --dane strona/dane --build _site --strona strona --repo . --wynik testy_wynik.json
      - name: Test przeglądarkowy (blokuje publikację)
        run: |
          pip install --quiet playwright==1.64.1
          python3 -m playwright install --with-deps chromium
          python3 testy/test_przegladarka.py _site --wynik testy_przegladarka.json
      - name: Usuń jawne dane robocze
        if: always()
        run: rm -f stan/stan.json.gz stan/poprzedni.enc strona/dane/*.json && rm -f narzedzia/aktualizuj.py narzedzia/dowody.py narzedzia/eksport.py narzedzia/reguly.py narzedzia/slownik.py narzedzia/wspolne.py strona/aplikacja.html testy/testy_danych.py testy/zakazane.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  publikuj:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
